<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
<!-- Background Layer with Professional Healthcare Imagery -->
<div class="fixed inset-0 z-0 h-full w-full">
<div class="h-full w-full bg-cover bg-center" data-alt="A professional medical setting showing a modern, high-tech pharmacy interior with clean white shelves, soft teal lighting, and blurred pharmaceutical equipment. The atmosphere is serene and trustworthy, featuring a bright, light-mode aesthetic with expansive depth. The colors are predominantly soft blues and surgical whites, conveying precision and medical expertise." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqPqH8kZq3dHFqycE_5-27yU6M-byCMXO4PuG8POopEStj1toYqsPWS44l2AJT4U70hWeeS_YsWa6TCFlfKwjtUCgIgukdbOcBgzhAKMcg5srsh70b4bP3vIvNch_5pOvnEptEjeiaAFq2FteLYfu321qLdGaFdA1wrsU3BL4pMVMtiPt8EEottoa_lOfAM89uvNoMorboIVRdfx1CGXxl38TFpC8UlSvh_a_cN_AEyeimywYhtFfOM9dqMwUHJoz-3q2dgPWYun8')">
</div>
<!-- Brand Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/30 to-background/80"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-margin animate-in fade-in duration-700">
<!-- Branding Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[32px]">medical_services</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background tracking-tight">
                Sanjeevani Medical
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">
                Pharmacy Management Portal
            </p>
</div>
<!-- Central Login Card -->
<div class="glass-panel p-xl rounded-xl shadow-2xl">
<form class="space-y-lg" id="loginForm" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                        Email Address
                    </label>
<div class="relative group">
<input class="w-full h-12 px-md rounded-lg border border-outline-variant bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant" id="email" placeholder="pharmacist@sanjeevani.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
                            Password
                        </label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative group">
<input class="w-full h-12 px-md rounded-lg border border-outline-variant bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">
                        Keep me logged in
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary hover:bg-primary-container text-white font-title-lg text-title-lg rounded-lg shadow-md hover:shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- SSO / Alternate Login (Bento-style secondary options) -->
<div class="mt-xl pt-xl border-t border-outline-variant/30">
<p class="text-center font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-widest">
                    Authorized Access Only
                </p>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center h-10 gap-sm bg-white border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px]">badge</span>
<span class="font-label-md text-label-md">ID Card</span>
</button>
<button class="flex items-center justify-center h-10 gap-sm bg-white border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px]">fingerprint</span>
<span class="font-label-md text-label-md">Biometric</span>
</button>
</div>
</div>
</div>
<!-- Footer Policy -->
<footer class="mt-xl text-center space-y-xs">
<p class="font-label-md text-label-md text-on-surface-variant/60">
                © 2024 Sanjeevani Medical Systems. All Rights Reserved.
            </p>
<div class="flex justify-center gap-md">
<a class="font-label-md text-label-md text-on-surface-variant/80 hover:text-primary" href="#">Privacy Policy</a>
<span class="text-on-surface-variant/30">•</span>
<a class="font-label-md text-label-md text-on-surface-variant/80 hover:text-primary" href="#">Terms of Service</a>
</div>
</footer>
</main>
<!-- Interactive Micro-interactions Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        const togglePassword = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.querySelector('span').textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Form Submission visual feedback
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome Back';
                btn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
</body></html>
